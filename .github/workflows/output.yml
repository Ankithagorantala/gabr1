name: output

on:
  push:
    branches: ["master", "main", "dev"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      build_status: ${{ steps.build_output.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: npm install

      - name: Create Build Output
        id: build_output
        run: 'echo "status=success" >> "$GITHUB_OUTPUT"'

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: echo "code is tested"

      - name: Show Build Output
        run: 'echo "Build Status: ${{ needs.build.outputs.build_status }}"'

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - test

    steps:
      - name: Deploy
        run: echo "my code is deployed"

      - name: Show Build Output
        run: 'echo "Build Result: ${{ needs.build.outputs.build_status }}"'
