name: Node.js Matrix CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build_and_test:
    name: Build and Test - Node ${{ matrix.node-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build
